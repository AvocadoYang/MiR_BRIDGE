[project]
name = "mir-bridge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aio-pika>=9.6.2",
    "cowsay>=6.1",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pydantic>=2.13.4",
    "pydot>=4.0.1",
    "python-socketio[asyncio-client]>=5.16.2",
    "python-statemachine>=3.2.0",
    "pyyaml>=6.0.3",
    "reactivex>=4.1.0",
    "requests>=2.34.2",
    "uvicorn>=0.49.0",
    "websockets>=16.0",
]


[tool.ruff]
line-length = 100 

[tool.ruff.lint]
select = ["E", "F", "I"] 

[tool.ruff.format]
quote-style = "single"

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
]
